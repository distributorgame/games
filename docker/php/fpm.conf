[www]
user = nobody
group = nobody

; Listen on all interfaces — nginx connects from a separate container via Docker network
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Pass all env vars to PHP workers
clear_env = no
catch_workers_output = yes
